name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행할 수 있게 한다 (배포 검증용)
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한을 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 진행한다.
# 단, 이미 배포 중인 것은 취소하지 않는다 — Pages 배포를 도중에 끊으면
# 다음 배포가 큐에서 대기하다 "Timeout reached, aborting!"으로 실패한다.
# (GitHub 공식 Pages 워크플로 템플릿도 cancel-in-progress: false를 쓴다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Secrets가 비어 있으면 앱이 자동으로 mock 모드로 동작한다. (src/lib/supabase.ts)
        # BE가 Supabase 프로젝트를 만들면 아래 두 Secret만 등록하면 실 연동으로 전환된다.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # enablement: true 를 주면 저장소에 Pages가 꺼져 있어도 워크플로가 직접 켠다.
      # (Settings > Pages 에서 Source를 손으로 바꾸지 않아도 된다)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: >-
        ${{ steps.deployment.outputs.page_url
            || steps.retry.outputs.page_url
            || steps.final.outputs.page_url }}
    timeout-minutes: 40
    steps:
      # Pages 배포는 두 가지 이유로 실패한다.
      #   1) 처리가 10분을 넘긴다. deploy-pages의 대기 상한이 10분이라 늘릴 수 없다.
      #   2) GitHub Pages 쪽 장애. 이때는 몇 초 만에 바로 실패한다.
      #
      # 그래서 실패하면 '기다렸다가' 다시 시도한다. 08.06 장애 때는 실패 4초 뒤에
      # 재시도가 붙어서 같이 죽었다. 간격 없는 재시도는 재시도가 아니다.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before last attempt
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: sleep 180

      # 마지막 시도는 continue-on-error를 두지 않는다. 여기서도 실패하면 잡을 실패시킨다.
      - id: final
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
