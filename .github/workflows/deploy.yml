name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 수동 실행할 수 있게 한다 (배포 검증용)
  workflow_dispatch:

# GITHUB_TOKEN에 Pages 배포 권한을 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 진행한다. 진행 중인 배포는 끊지 않는다.
# (GitHub 공식 Pages 워크플로 템플릿과 동일)
#
# 주의: 이 그룹에서 '대기 중' 런은 GitHub가 1개만 유지한다. cancel-in-progress: false는
# 실행 중인 런만 보호할 뿐, 큐에 있던 런은 새 푸시가 오면 무조건 취소된다.
# 그래서 deploy 잡이 락을 오래 잡고 있으면 그 사이 푸시가 전부 취소된다.
# deploy 잡을 짧게 유지하는 것이 이 워크플로의 가장 중요한 제약이다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Secrets가 비어 있으면 앱이 자동으로 mock 모드로 동작한다. (src/lib/supabase.ts)
        # BE가 Supabase 프로젝트를 만들면 아래 두 Secret만 등록하면 실 연동으로 전환된다.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # enablement: true 를 주면 저장소에 Pages가 꺼져 있어도 워크플로가 직접 켠다.
      # (Settings > Pages 에서 Source를 손으로 바꾸지 않아도 된다)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 잡 자체의 상한. deploy-pages 내부 timeout(8분)보다 넉넉히 크게 두어,
    # 실패 원인이 '액션의 폴링 타임아웃'으로 명확히 로그에 남게 한다.
    timeout-minutes: 12
    steps:
      # 시도는 한 번만 한다.
      #
      # 같은 잡 안에서 deploy-pages를 반복하는 건 재시도가 아니다. 동일한 아티팩트로
      # 같은 Pages 백엔드를 다시 폴링할 뿐이라, 백엔드가 죽어 있으면 대기 시간만 배로 늘고
      # 그동안 위 concurrency 락을 계속 점유해서 뒤따르는 푸시를 전부 취소시킨다.
      # (08.06에 3단 재시도를 넣은 뒤 #29·#30·#32가 연달아 cancelled 된 원인)
      #
      # Pages 장애로 실패했다면 재시도 단위는 '런 전체'다. Actions 탭에서 Re-run 하거나
      # workflow_dispatch로 다시 돌린다. 그 편이 빠르고 큐도 막지 않는다.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 기본 10분. 5MB짜리 정적 사이트가 8분을 넘기면 정상 배포가 아니라 장애다.
          # 빨리 실패해서 락을 놓아주는 쪽이 낫다.
          timeout: 480000
